titles:
  - name: Senior Engineering Manager
    patterns:
      - '\b(?:senior|sr\.?)\s+(?:engineering|software)\s+manager\b'
      - '\b(?:senior|sr\.?)\s+manager\s*[,\-:]?\s*(?:sw\s+|software\s+)?engineering\b'
      - '\bhead\s+of\s+engineering\b'
    excludes:
      - '\bstaff\b'
      - 'program'
      - 'product\s+manager'
      - 'project\s+manager'
      - 'software\s+engineer\b'
      - '\bml\s+engineer'
      - 'machine\s+learning\s+engineer'
