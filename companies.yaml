# Sorted alphabetically by company name (case-insensitive).
#
# Each company has:
#   - name:       Display name used in reports
#   - url:        Canonical careers URL (for fallback / reference)
#   - region:     Bay Area | CA Other | Washington | NYC
#   - hq:         HQ city
#   - ats:        greenhouse | lever | ashby | workable | smartrecruiters | unknown | skip
#   - ats_config: ATS-specific identifiers (typically a slug or board name)
#   - probe_url:  (optional) override URL used by probe.py
#
# `ats: unknown` entries still need verification. The block comment below
# each such entry shows what probe v3 found (typically 0-job matches that
# are likely false positives — slug collisions or stale boards).
#
# Verification source is noted on each `ats:` line:
#   # detected via probe          — probe v2 (HTML/redirect scan)
#   # detected via probe v3 (N)   — probe v3 (direct API call), N jobs
#   # detected via probe v2 + v3  — both probes agree
#   # VERIFIED at scaffold time   — confirmed manually during initial build

companies:

  - name: Airbyte
    url: https://airbyte.com/company/careers
    region: Bay Area
    hq: San Francisco
    ats: ashby  # detected via probe
    ats_config:
      org: airbyte

